name: PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  sanity-checks:
    name: PR Sanity Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for merge conflict markers
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
              --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "::error::Merge conflict markers found in the diff."
            exit 1
          fi
          echo "No merge conflict markers found."

      - name: Check for accidentally committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example'; then
            echo "::error::A .env file appears to be committed. Remove secrets from version control."
            exit 1
          fi
          echo "No committed .env files found."

      - name: Check PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $PR_TITLE"
          if [ -z "$PR_TITLE" ]; then
            echo "::error::PR title is empty."
            exit 1
          fi

  frontend-build-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend-install-check:
    name: Backend Install Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci