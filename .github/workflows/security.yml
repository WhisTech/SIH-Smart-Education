name: Security

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [frontend, backend]

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high+ severity)
        run: npm audit --audit-level=high

  secret-scan:
    name: Scan for Hardcoded Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Basic secret pattern scan
        run: |
          set -e
          PATTERN='(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z\-_]{35}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----|sk-[A-Za-z0-9]{20,})'
          MATCHES=$(grep -RInE "$PATTERN" \
            --exclude-dir=node_modules --exclude-dir=.git . || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "::error::Potential hardcoded secret detected. Review the matches above."
            exit 1
          fi
          echo "No obvious hardcoded secrets found."